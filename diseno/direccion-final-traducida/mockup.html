<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rhino — Dirección final traducida</title>
<style>
:root{--night:#021326;--navy:#031d36;--cyan:#11b7c9;--lime:#84d600;--orange:#ff9f1c;--violet:#8b5cf6;--paper:#f4f7f8;--white:#fff;--ink:#10233f;--muted:#6d7b8f;--line:#dbe4ea;--green:#57b80c;--shadow:0 8px 26px rgba(3,29,54,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}.technical{position:relative;overflow:hidden;background:radial-gradient(circle at 78% 18%,rgba(17,183,201,.14),transparent 26%),linear-gradient(145deg,#01101f,#03233f 60%,#03192e)}.technical:before,.technical:after{content:"";position:absolute;inset:-20%;pointer-events:none;background:repeating-linear-gradient(145deg,transparent 0 23px,rgba(17,183,201,.08) 24px 25px,transparent 26px 50px);transform:rotate(-6deg)}.technical:after{inset:5% -5% auto 42%;height:68%;border:1px solid rgba(17,183,201,.22);border-radius:48%;background:none;box-shadow:0 0 0 30px rgba(132,214,0,.035),0 0 0 62px rgba(17,183,201,.025)}
.access{min-height:100vh;padding:34px 3vw;color:#fff}.brand{text-align:center;position:relative;z-index:1}.brand h1{margin:46px 0 0;font-family:"Arial Narrow",Impact,sans-serif;font-stretch:condensed;font-size:clamp(34px,5vw,68px);letter-spacing:.01em;text-shadow:0 3px 9px #000}.brand b{display:block;color:var(--cyan);font-size:clamp(13px,1.7vw,22px);letter-spacing:.18em}.brand i{display:block;width:46px;height:4px;margin:16px auto;background:var(--lime)}.brand p{color:#b8c9d7}.lock{position:relative;z-index:1;font-size:13px;color:#d7e3eb}.month{display:inline-flex;margin-top:5px;padding:11px 24px;border:1px solid #678096;border-radius:28px;gap:28px;align-items:center}.people{position:relative;z-index:1;max-width:1160px;margin:22px auto}.person{display:grid;grid-template-columns:minmax(250px,1.3fr) .55fr .55fr .8fr 128px;align-items:center;background:#fff;color:var(--ink);min-height:78px;margin:4px 0;padding:10px 18px;border-radius:7px;box-shadow:var(--shadow)}.person.active{outline:2px solid var(--cyan)}.identity{display:flex;gap:14px;align-items:center}.avatar{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,var(--cyan),#068ba1);color:white;font-size:23px;flex:none}.avatar.violet{background:linear-gradient(145deg,#a878ff,#7544e6)}.avatar.orange{background:linear-gradient(145deg,#ffad35,#f07b08)}.avatar.blue{background:linear-gradient(145deg,#3c9bea,#1766ae)}.identity strong{display:block;font-size:17px}.sub,.tiny{font-size:11px;color:var(--muted)}.metric{padding-left:18px;border-left:1px solid var(--line);font-size:13px}.metric b{font-size:21px}.status{display:inline-flex;gap:7px;align-items:center;padding:7px 12px;border-radius:8px;background:#edf8e6;color:#31780b;font-weight:700;font-size:12px}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}.primary{border:0;border-radius:6px;background:linear-gradient(135deg,#92e600,#72c700);color:#163000;min-height:42px;padding:0 18px;font-weight:800;box-shadow:0 5px 12px rgba(95,170,0,.18)}
.app{min-height:100vh}.top{height:72px;padding:0 22px;color:#fff;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.logo{font-family:"Arial Narrow",Impact,sans-serif;font-size:23px;letter-spacing:.03em}.logo small{display:block;font-family:"Segoe UI";font-size:10px;letter-spacing:.16em;color:var(--cyan)}.profile{display:flex;align-items:center;gap:12px}.profile .avatar{width:42px;height:42px;font-size:18px}.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 72px)}.side{background:var(--navy);color:#dbe8f0;padding:20px 14px;position:relative;overflow:hidden}.side:after{content:"";position:absolute;right:-70px;bottom:-45px;width:180px;height:180px;border:1px solid rgba(17,183,201,.18);border-radius:50%}.nav{display:flex;align-items:center;gap:12px;min-height:48px;margin:3px 0;padding:0 14px;border-radius:6px;font-size:14px}.nav.on{background:linear-gradient(90deg,rgba(17,183,201,.3),rgba(17,183,201,.08));border-left:3px solid var(--cyan);color:#fff}.nav.action{background:linear-gradient(90deg,#90e400,#74cb00);color:#173100;font-weight:800}.year{margin-top:25px;border-top:1px solid rgba(255,255,255,.15);padding:22px 8px}.year select{width:100%;padding:11px;border:1px solid #456078;border-radius:6px;background:#082641;color:#fff}.content{padding:22px 26px 30px;overflow:hidden}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}.heading h1{margin:0;font-size:27px}.heading p{margin:4px 0 0;color:var(--muted);font-size:12px}.months{display:grid;grid-template-columns:repeat(5,1fr) 1.25fr 52px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.month-cell{text-align:center;padding:10px;border-right:1px solid var(--line);font-size:11px}.month-cell b{display:block;font-size:15px}.month-cell.current{background:linear-gradient(135deg,#91e500,#72c900);color:#173000}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}.kpi{display:flex;align-items:center;gap:15px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 16px;box-shadow:0 2px 7px rgba(3,29,54,.025)}.kpi .avatar{width:47px;height:47px;font-size:19px}.kpi b{font-size:25px}.workspace{display:grid;grid-template-columns:minmax(290px,.75fr) minmax(520px,1.35fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px;box-shadow:0 3px 10px rgba(3,29,54,.035)}.panel h2{margin:0 0 15px;font-size:18px}.panel h2:after{content:"";display:block;width:36px;height:3px;background:var(--cyan);margin-top:8px}.field{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;align-items:center;margin:9px 0;font-size:11px}.control{height:38px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:0 11px;color:var(--muted)}textarea.control{height:74px;padding-top:10px}.spans{display:grid;grid-template-columns:1fr 1fr;gap:7px}.state-row{display:flex;gap:6px}.pill{border:1px solid;border-radius:5px;padding:6px 9px;font-size:10px;font-weight:700}.pill.program{color:#19698d;background:#e9f7fc;border-color:#9ddbec}.pill.progress{color:#9b6200;background:#fff8df;border-color:#f4d278}.pill.done{color:#2c780b;background:#eef9e7;border-color:#b8df9f}.linkbox{border:1px dashed #7fcbd3;background:#f6fdfe;border-radius:5px;padding:14px;text-align:center;color:#16869a;font-size:12px}.form-actions{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-top:15px}.secondary{border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:700}.table-tools{display:flex;justify-content:flex-end;gap:8px;margin-top:-44px;margin-bottom:15px}.search{border:1px solid var(--line);border-radius:5px;padding:9px;width:180px}.table{width:100%;border-collapse:collapse;font-size:10px}.table th{text-align:left;background:#f7f9fa;padding:9px;color:#506177}.table td{padding:9px;border-bottom:1px solid #e8eef2}.titlecell b{display:block}.actions{font-size:15px;white-space:nowrap}.burson-banner{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(100deg,var(--navy),#073a59);color:white;border-radius:9px;padding:16px 20px;margin-bottom:14px}.burson-banner p{margin:3px 0 0;color:#a9c9d8;font-size:12px}.thread{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.bubble{max-width:78%;padding:10px;border-radius:8px;background:#eaf8fa;margin:7px 0;font-size:11px}.bubble.admin{margin-left:auto;background:#eef8e6}.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.calendar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}.mini h3{text-align:center;margin:0 0 7px;font-size:11px}.days{display:grid;grid-template-columns:repeat(7,1fr);font-size:8px;text-align:center;gap:2px}.days b{color:#8090a0}.day{height:18px;display:grid;place-items:center}.day.mark{border-radius:9px;background:var(--cyan);color:#fff;font-weight:800}.day.range{border-radius:2px;background:#dff5f7;color:#08768a;font-weight:800}.day.lime{background:var(--lime);color:#173000}.detail h2{font-size:20px}.detail dl{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:11px;border-block:1px solid var(--line);padding:14px 0}.detail dt{font-weight:800}.detail dd{margin:0}.opinion{padding:12px;background:#f7f9fa;border-radius:6px;font-size:11px;line-height:1.5}.bottom-nav{display:none}
@media(max-width:900px){.shell{grid-template-columns:82px minmax(0,1fr)}.side{padding:15px 8px}.nav{justify-content:center;padding:0;font-size:0}.nav span:first-child{font-size:20px}.year{display:none}.content{padding:18px}.workspace{grid-template-columns:1fr}.calendar-layout{grid-template-columns:1fr}.calendar-grid{grid-template-columns:repeat(2,1fr)}.detail{position:fixed;right:0;top:72px;bottom:0;width:42%;z-index:5}.person{grid-template-columns:1.2fr .5fr .5fr 110px}.person .metric:nth-of-type(3){display:none}}
@media(max-width:600px){.top{height:60px;padding:0 14px}.logo{font-size:16px}.profile .tiny,.profile>span{display:none}.shell{display:block;min-height:calc(100vh - 60px)}.side{display:none}.content{padding:14px 12px 84px}.heading{align-items:flex-start}.heading h1{font-size:22px}.heading .primary{padding:0 12px}.months{grid-template-columns:repeat(3,1fr);overflow:auto}.month-cell:nth-child(-n+3),.month-cell:last-child{display:none}.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:10px;gap:9px}.kpi .avatar{width:37px;height:37px}.kpi b{font-size:20px}.workspace{display:block}.panel{margin-bottom:10px;padding:14px}.table-panel{padding:0;background:transparent;border:0;box-shadow:none}.table-tools{margin:0 0 8px}.table thead{display:none}.table,.table tbody,.table tr,.table td{display:block}.table tr{background:#fff;border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:10px}.table td{border:0;padding:3px}.table td:nth-child(3){display:none}.field{grid-template-columns:1fr;gap:5px}.spans{grid-template-columns:1fr}.form-actions{grid-template-columns:1fr}.secondary{min-height:42px}.bottom-nav{display:grid;position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;grid-template-columns:repeat(4,1fr);background:var(--navy);color:#d8e7ef}.bottom-nav div{display:grid;place-items:center;align-content:center;gap:2px;font-size:9px}.bottom-nav b{font-size:18px}.bottom-nav .on{color:var(--lime);border-top:3px solid var(--lime)}.calendar-grid{grid-template-columns:1fr}.calendar-layout .detail{display:none}.access{padding:18px 12px}.brand h1{margin-top:30px;font-size:35px}.brand b{font-size:11px}.person{grid-template-columns:1fr 88px;padding:10px 12px}.person>.status,.person>.metric{display:none}.person .primary{padding:0 10px}.people{margin-top:16px}.burson-banner{align-items:flex-start;gap:10px}.burson-banner .primary{padding:0 10px}.thread{display:none}}
.admin-workspace{grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr)}
.view-burson .state-field{display:none}
@media(min-width:601px) and (max-width:900px){.admin-workspace{grid-template-columns:1fr}.calendar-layout{grid-template-columns:minmax(0,1fr) 42%}.calendar-grid{grid-template-columns:1fr}.detail{position:sticky;top:88px;bottom:auto;align-self:start;width:auto;height:calc(100vh - 106px)}}
@media(min-width:901px) and (max-height:800px){.content{padding-top:14px}.heading{margin-bottom:10px}.months,.kpis{margin-bottom:10px}.panel{padding:12px}.field{margin:6px 0}.control{height:34px}textarea.control{height:58px}.linkbox{padding:10px}.form-actions{margin-top:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const qs=new URLSearchParams(location.search),view=qs.get('view')||'operario';
const data={
 operario:{name:'Ana Torres',role:'Operario audiovisual',icon:'◉',title:'Mis actividades',subtitle:'Encargos recibidos por teléfono y registrados por ti'},
 admin:{name:'Marco Admin',role:'Administración',icon:'◇',title:'Panel general',subtitle:'Toda la operación audiovisual en un solo lugar'},
 burson:{name:'Equipo Burson',role:'Cliente aliado',icon:'B',title:'Encargos Burson',subtitle:'Solicitudes asignadas automáticamente al operario especial'},
 historico:{name:'Marco Admin',role:'Administración',icon:'◇',title:'Histórico 2026',subtitle:'Todas las actividades del año'}
};
const people=[['Ana Torres','Operario · Lima','◉','12'],['Luis Mendoza','Operario especial · encargos Burson','◈','9'],['Marco Admin','Administración','◇','34'],['Equipo Burson','Cliente aliado','B','6']];
function access(){return `<main class="access technical"><div class="lock">▣ &nbsp; Acceso mediante contraseña</div><header class="brand"><h1>CONTROL DE ACTIVIDADES</h1><b>RHINO AUDIOVISUALES</b><i></i><p>Gestión integral del equipo audiovisual</p><div class="month">▣ &nbsp; Agosto 2026 &nbsp;⌄</div></header><section class="people">${people.map((p,i)=>`<article class="person ${i===0?'active':''}"><div class="identity"><span class="avatar ${i===1?'violet':i===2?'orange':i===3?'blue':''}">${p[2]}</span><div><strong>${p[0]}</strong><span class="sub">${p[1]}</span></div></div><span class="status">Activo</span><span class="metric"><b>${p[3]}</b><br><span class="tiny">actividades</span></span><span class="metric">◷ <span class="tiny">Última actualización<br>20/08/2026 · 16:45</span></span><button class="primary">Ingresar&nbsp; ›</button></article>`).join('')}</section></main>`}
function topbar(d){return `<header class="top technical"><div class="logo">CONTROL DE ACTIVIDADES<small>RHINO AUDIOVISUALES</small></div><div class="profile"><span class="avatar">${d.icon}</span><span><b>${d.name}</b><small class="tiny" style="display:block;color:#bcd0dc">${d.role}</small></span><button class="secondary" style="height:38px;padding:0 14px;background:transparent;color:#fff;border-color:#547087">Cerrar sesión</button></div></header>`}
function side(active){const items=[['⌂','Mi panel','panel'],['＋','Nueva actividad','new'],['▣','Histórico anual','historico'],['B','Burson','burson'],['♙','Cuentas','cuentas']];return `<aside class="side">${items.map(x=>`<div class="nav ${active===x[2]?'on':''} ${x[2]==='new'?'action':''}"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}<div class="year"><span class="tiny" style="color:#aac0cf">AÑO</span><select><option>2026</option></select></div></aside>`}
function kpis(){return `<section class="kpis"><div class="kpi"><span class="avatar">▤</span><div><b>12</b><span class="tiny" style="display:block">actividades</span></div></div><div class="kpi"><span class="avatar violet">▣</span><div><b>3</b><span class="tiny" style="display:block">programadas</span></div></div><div class="kpi"><span class="avatar orange">◷</span><div><b>2</b><span class="tiny" style="display:block">en proceso</span></div></div><div class="kpi"><span class="avatar" style="background:linear-gradient(145deg,#73d51c,#3ba900)">✓</span><div><b>7</b><span class="tiny" style="display:block">entregadas</span></div></div></section>`}
function monthstrip(){return `<div class="months">${[['ABR','6'],['MAY','8'],['JUN','10'],['JUL','9'],['AGOSTO 2026','12'],['SEP','4']].map((x,i)=>`<div class="month-cell ${i===4?'current':''}">${x[0]}<b>${x[1]}</b></div>`).join('')}<div class="month-cell">›</div></div>`}
const rows=[['20/08/2026','Cobertura audiovisual Norte','Chimbote','Programada'],['18/08/2026','Edición campaña de seguridad vial','Lima','En proceso'],['12–19/08/2026','Registro de testimonios','Nuevo Chimbote','En proceso'],['11/08/2026','Piezas para campaña institucional','Lima','Entregada'],['04 · 11/08/2026','Locución institucional Burson','Remoto','Entregada']];
function table(){return `<div class="panel table-panel"><h2>Actividad reciente</h2><div class="table-tools"><input class="search" value="Buscar actividad"/><select class="search"><option>Todos los estados</option></select></div><table class="table"><thead><tr><th>Fechas</th><th>Actividad</th><th>Lugar</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r[0]}</td><td class="titlecell"><b>${r[1]}</b><span class="tiny">${i===4?'Origen: Burson':'Producción audiovisual'}</span></td><td>${r[2]}</td><td><span class="pill ${r[3]==='Programada'?'program':r[3]==='En proceso'?'progress':'done'}">${r[3]}</span></td><td class="actions">◉ &nbsp;${i<3?'✎':'↗'}</td></tr>`).join('')}</tbody></table></div>`}
function form(role){return `<div class="panel"><h2>${role==='burson'?'Nuevo encargo':'Registrar actividad'}</h2><div class="field"><b>Actividad</b><input class="control" value="Cobertura institucional"/></div><div class="field"><b>Fechas</b><div class="spans"><input class="control" value="20/08/2026"/><input class="control" value="27–29/08/2026"/></div></div><div class="field"><b>Lugar</b><input class="control" value="Chimbote"/></div><div class="field state-field"><b>Estado</b><div class="state-row"><span class="pill program">Programada</span><span class="pill progress">En proceso</span><span class="pill done">Entregada</span></div></div><div class="field"><b>Descripción</b><textarea class="control">Registro audiovisual de actividades y entrevistas.</textarea></div><div class="field"><b>${role==='burson'?'Referencia':'Entrega'}</b><div class="linkbox">⌁ &nbsp; ${role==='burson'?'Añadir enlace de referencia':'Enlace de OneDrive al finalizar'}</div></div><div class="form-actions"><button class="primary">${role==='burson'?'Crear encargo':'Guardar actividad'}</button><button class="secondary">Limpiar</button></div></div>`}
function burson(){return `<div class="burson-banner"><div><b>Canal Burson</b><p>Los encargos se asignan a Luis Mendoza, operario especial.</p></div><button class="primary">＋ Nuevo encargo</button></div><div class="workspace">${form('burson')}${table()}</div>`}
function admin(){return `<div class="workspace admin-workspace">${table()}<div class="panel"><h2>Detalle y conversación</h2><span class="pill done">Entregada</span><h3>Cobertura audiovisual Norte</h3><p class="tiny" style="line-height:1.6">Ana Torres · 4 y 11 de agosto, 2 de septiembre</p><div class="linkbox">↗ Abrir enlace de OneDrive</div><div class="thread"><div class="bubble admin">Admin: La entrega está completa. Revisaré la entrevista principal.</div><div class="bubble">Ana: Quedo atenta a tus comentarios.</div></div></div></div>`}
function calendar(){const names=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];return `<div class="calendar-layout"><section class="calendar-grid">${names.map((name,m)=>`<article class="mini"><h3>${name}</h3><div class="days">${['L','M','M','J','V','S','D'].map(d=>`<b>${d}</b>`).join('')}${Array.from({length:35},(_,i)=>{const n=(i+m*2)%31+1,mark=(m===0&&[4,11].includes(n))||(m===4&&n>=12&&n<=19)||(m===10&&n>=9&&n<=11);return `<span class="day ${mark?(m===4?'range':m===10?'lime':'mark'):''}">${n}</span>`}).join('')}</div></article>`).join('')}</section><aside class="panel detail"><span class="pill done">Entregada</span><h2>Cobertura audiovisual Norte</h2><dl><dt>Responsable</dt><dd>Ana Torres</dd><dt>Fechas</dt><dd>4 y 11 de enero<br>2 de febrero</dd><dt>Origen</dt><dd>Operario</dd></dl><h3>Descripción</h3><p class="tiny" style="line-height:1.6">Cobertura de actividades y entrevistas en las sedes del norte del país.</p><h3>Opinión del operario</h3><div class="opinion">El material cumplió con los objetivos y la calidad técnica requerida.</div><button class="primary" style="width:100%;margin-top:14px">Abrir OneDrive&nbsp; ↗</button></aside></div>`}
function app(){const d=data[view]||data.operario,active=view==='historico'?'historico':view==='burson'?'burson':'panel';let body=view==='historico'?calendar():view==='burson'?burson():view==='admin'?admin():`<div class="workspace">${form('operario')}${table()}</div>`;return `<main class="app view-${view}">${topbar(d)}<div class="shell">${side(active)}<section class="content"><header class="heading"><div><h1>${d.title}</h1><p>${d.subtitle}</p></div>${view==='operario'?'<button class="primary">＋ Nueva actividad</button>':''}</header>${view==='historico'?'':monthstrip()+kpis()}${body}</section></div><nav class="bottom-nav"><div class="${view==='historico'?'':'on'}"><b>⌂</b>Panel</div><div><b>＋</b>Nueva</div><div class="${view==='historico'?'on':''}"><b>▣</b>Histórico</div><div><b>◉</b>Cuenta</div></nav></main>`}
document.getElementById('root').innerHTML=view==='acceso'?access():app();
</script>
</body>
</html>
